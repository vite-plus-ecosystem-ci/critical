allowBuilds:
  puppeteer: true
  unrs-resolver: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.3b99001a24f162be6a4478c3b97f3d0eb81c96c8
  vitest: 5.0.4
  vite-plus: 0.0.0-commit.3b99001a24f162be6a4478c3b97f3d0eb81c96c8
  "@vitest/coverage-v8": 5.0.4
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  minimatch: ">=3.1.4"
nodeVersion: 22.22.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
  - "@voidzero-dev/vite-plus-*"
  - vite-plus
